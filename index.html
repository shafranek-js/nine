<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monte Carlo / Nine (1993)</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #06090b;
        color: #d6dce6;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        overflow: hidden;
      }

      body.mode-hd::before {
        content: '';
        position: fixed;
        inset: -24px;
        z-index: 0;
        background:
          radial-gradient(circle at 50% 42%, rgba(28, 72, 46, 0.34), rgba(5, 8, 10, 0.92) 72%),
          url('./assets/hd/table_bg_hd.jpg') center / cover no-repeat;
        filter: blur(18px) brightness(0.32) saturate(1.08);
        pointer-events: none;
      }

      body.mode-ega::before {
        content: none;
      }

      #app {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
      }

      .club-workspace {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: clamp(214px, 18.5vw, 268px) minmax(0, 1fr) clamp(214px, 18.5vw, 268px);
        gap: 12px;
        padding: 10px 14px;
        align-items: stretch;
      }

      #app.sidebars-hidden .club-workspace {
        grid-template-columns: minmax(0, 1fr);
      }

      #app.sidebars-hidden .side-panel {
        display: none;
      }

      .side-panel {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
        overflow: hidden;
      }

      .panel-card {
        background: rgba(11, 17, 14, 0.84);
        border: 1px solid rgba(212, 175, 55, 0.24);
        border-radius: 10px;
        padding: 10px 11px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 228, 150, 0.06);
        backdrop-filter: blur(8px);
      }

      body.mode-ega .panel-card {
        background: #0d1016;
        border-color: #2c3342;
        backdrop-filter: none;
      }

      .panel-card-grow {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .panel-card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin-bottom: 8px;
      }

      .panel-title {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #e4c46c;
      }

      .panel-badges {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .pill-badge {
        font-size: 10px;
        font-weight: 600;
        padding: 2px 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: #cfd6e2;
        white-space: nowrap;
      }

      .pill-gold {
        background: rgba(212, 175, 55, 0.14);
        border-color: rgba(212, 175, 55, 0.42);
        color: #f3d780;
      }

      .turn-banner {
        font-size: 12px;
        font-weight: 600;
        color: #f5efe0;
        background: rgba(25, 56, 39, 0.48);
        border: 1px solid rgba(112, 184, 134, 0.25);
        border-radius: 6px;
        padding: 6px 8px;
        margin-bottom: 8px;
      }

      .seat-list {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .seat-row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
        padding: 5px 7px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid transparent;
      }

      .seat-row-active {
        background: rgba(212, 175, 55, 0.12);
        border-color: rgba(212, 175, 55, 0.48);
      }

      .seat-name {
        font-weight: 600;
        color: #ece6d6;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .seat-cards {
        font-size: 10.5px;
        color: #9bb0a2;
      }

      .seat-cash {
        font-weight: 700;
        color: #f0cf6e;
        font-variant-numeric: tabular-nums;
      }

      .move-log {
        list-style: none;
        margin: 0;
        padding: 0;
        flex: 1 1 auto;
        min-height: 60px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-family: ui-monospace, 'Cascadia Mono', 'Consolas', monospace;
        font-size: 11px;
      }

      .move-log::-webkit-scrollbar {
        width: 5px;
      }

      .move-log::-webkit-scrollbar-thumb {
        background: rgba(212, 175, 55, 0.28);
        border-radius: 4px;
      }

      .move-item {
        padding: 3px 6px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.03);
        border-left: 2px solid rgba(255, 255, 255, 0.14);
        color: #d7dde6;
      }

      .move-round {
        border-left-color: #d4af37;
        color: #e6cb7a;
        background: rgba(212, 175, 55, 0.08);
        font-weight: 600;
      }

      .move-pass {
        border-left-color: #cf4a54;
        color: #f0a8ae;
      }

      .move-win {
        border-left-color: #4dc47c;
        color: #9be8b8;
        background: rgba(77, 196, 124, 0.1);
        font-weight: 600;
      }

      .move-empty {
        color: #87968c;
        font-size: 11px;
        padding: 4px 2px;
      }

      .rules-list {
        margin: 0;
        padding-left: 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 11px;
        line-height: 1.35;
        color: #b7c2ba;
      }

      .profile-line {
        font-size: 11.5px;
        color: #e8e1cf;
        margin-bottom: 8px;
      }

      .sub-heading {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: #93a29a;
        margin-bottom: 5px;
      }

      .leaders-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .leader-row {
        display: flex;
        justify-content: space-between;
        font-size: 11.5px;
        padding: 3px 6px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.03);
      }

      .leader-name {
        color: #dde3ea;
      }

      .leader-score {
        font-weight: 700;
        color: #e7c667;
        font-variant-numeric: tabular-nums;
      }

      .leader-empty {
        font-size: 11px;
        color: #84908a;
      }

      .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .shell-btn {
        background: rgba(24, 34, 29, 0.9);
        color: #e5dfd0;
        border: 1px solid rgba(212, 175, 55, 0.26);
        border-radius: 6px;
        padding: 6px 7px;
        font: inherit;
        font-size: 10.8px;
        font-weight: 600;
        cursor: pointer;
        text-align: center;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .shell-btn:hover {
        background: rgba(38, 56, 46, 0.95);
        border-color: rgba(236, 198, 86, 0.62);
      }

      body.mode-ega .shell-btn {
        background: #141822;
        border-color: #30384b;
      }

      .shell-btn-danger {
        grid-column: 1 / -1;
        border-color: rgba(210, 74, 84, 0.38);
        color: #f0b6bc;
      }

      .shell-btn-danger:hover {
        background: rgba(96, 26, 34, 0.65);
        border-color: rgba(228, 92, 102, 0.72);
      }

      .lang-segmented {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        margin-bottom: 7px;
      }

      .mode-segmented {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 4px;
        margin: 6px 0 4px;
      }

      .fantan-opts-row {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 4px;
        margin-bottom: 6px;
      }

      .fantan-opts-row.is-hidden {
        display: none;
      }

      .rules-pending-note {
        margin: -2px 0 6px;
        font-size: 10px;
        line-height: 1.3;
        color: #f3c86c;
      }

      .rules-pending-note.is-hidden {
        display: none;
      }

      .mode-opt-btn {
        padding: 4px 5px;
        font-size: 10px;
      }

      .lang-btn {
        padding: 4px 0;
        font-size: 10.5px;
        letter-spacing: 0.04em;
      }

      .lang-btn.is-active {
        background: rgba(212, 175, 55, 0.22);
        border-color: rgba(242, 206, 98, 0.78);
        color: #fff2c2;
      }

      body.mode-ega .lang-btn.is-active {
        background: #232d42;
        border-color: #6b88bd;
        color: #f4f7ff;
      }

      .stage-column {
        position: relative;
        min-width: 0;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .stage-frame {
        position: relative;
        background: #000;
        border: none;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
        line-height: 0;
      }

      .stage-frame canvas {
        outline: none;
      }

      .focus-toggle-pill {
        position: absolute;
        top: 6px;
        right: 6px;
        z-index: 5;
        background: rgba(11, 17, 14, 0.78);
        color: #dfd2ac;
        border: 1px solid rgba(212, 175, 55, 0.35);
        border-radius: 999px;
        padding: 4px 10px;
        font: inherit;
        font-size: 10.5px;
        font-weight: 600;
        cursor: pointer;
        opacity: 0.62;
        transition: opacity 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      }

      .focus-toggle-pill:hover {
        opacity: 1;
        background: rgba(22, 34, 28, 0.94);
        border-color: rgba(236, 198, 86, 0.75);
      }

      .ega-scanlines {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0px,
          rgba(0, 0, 0, 0) 2px,
          rgba(0, 0, 0, 0.26) 2px,
          rgba(0, 0, 0, 0.26) 4px
        );
      }

      .loading-msg {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #a6b0c4;
        font-size: 13px;
        letter-spacing: 0.04em;
      }

      @media (max-width: 1080px) {
        html,
        body {
          overflow-y: auto;
        }

        .club-workspace {
          grid-template-columns: 1fr 1fr;
          grid-template-rows: minmax(280px, 70vh) auto;
          height: auto;
        }

        .stage-column {
          grid-column: 1 / -1;
          grid-row: 1;
          height: 68vh;
        }

        .side-panel-left {
          grid-column: 1;
          grid-row: 2;
        }

        .side-panel-right {
          grid-column: 2;
          grid-row: 2;
        }
      }

      @media (max-width: 700px) {
        .club-workspace {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(240px, 56vh) auto auto;
        }

        .stage-column {
          height: 54vh;
        }

        .side-panel-left {
          grid-column: 1;
          grid-row: 2;
        }

        .side-panel-right {
          grid-column: 1;
          grid-row: 3;
        }
      }
      .advisor-card {
        display: flex;
        flex-direction: column;
        gap: 7px;
        min-height: 0;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(215, 178, 92, 0.35) transparent;
        border-color: rgba(82, 224, 144, 0.28);
        background: linear-gradient(180deg, rgba(16, 28, 20, 0.94) 0%, rgba(11, 14, 12, 0.96) 100%);
      }
      .advisor-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        flex-wrap: wrap;
      }
      .advisor-title-wrap .panel-title {
        margin: 0;
      }
      .advisor-toggle-btn {
        font-size: 11px;
        padding: 4px 7px;
        line-height: 1.1;
        border-color: rgba(215, 178, 92, 0.32);
      }
      .advisor-toggle-btn.is-active {
        background: rgba(34, 96, 58, 0.85);
        border-color: rgba(94, 238, 160, 0.65);
        color: #dcfce7;
      }
      .advisor-toggle-btn.is-xray-active {
        background: rgba(20, 74, 102, 0.88);
        border-color: rgba(96, 218, 255, 0.72);
        color: #dcf6ff;
      }
      .advisor-toggle-btn.is-auto-active {
        background: rgba(118, 76, 16, 0.9);
        border-color: rgba(250, 204, 21, 0.72);
        color: #fef08a;
      }
      .advisor-toggles {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
      }
      .advisor-deduction-hand {
        line-height: 1.45;
      }
      .advisor-top-row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      .advisor-mascot-frame {
        flex: 0 0 auto;
        border-radius: 6px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
      }
      .advisor-mascot-canvas {
        display: block;
      }
      .advisor-bubble {
        flex: 1 1 auto;
        min-width: 0;
        position: relative;
        padding: 7px 9px;
        border-radius: 7px;
        background: rgba(25, 38, 29, 0.95);
        border: 1px solid rgba(94, 238, 160, 0.32);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }
      .advisor-bubble::before {
        content: '';
        position: absolute;
        left: -6px;
        top: 16px;
        width: 0;
        height: 0;
        border-top: 5px solid transparent;
        border-bottom: 5px solid transparent;
        border-right: 6px solid rgba(94, 238, 160, 0.4);
      }
      .advisor-headline {
        font-size: 12.5px;
        font-weight: 700;
        color: #f4e6be;
        line-height: 1.25;
      }
      .advisor-meta {
        margin-top: 3px;
        font-size: 10.5px;
        color: #93b8a1;
      }
      .advisor-reasons {
        margin: 0;
        padding-left: 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 11.5px;
        line-height: 1.32;
        color: #e4e1d6;
      }
      .advisor-reasons li::marker {
        color: #5eeea0;
      }
      .advisor-subhead {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #b7a982;
        margin-bottom: 3px;
      }
      .advisor-candidates {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .advisor-cand-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 3px 6px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        font-size: 11px;
        color: #cbc6b8;
      }
      .advisor-cand-row.is-best {
        background: rgba(34, 96, 58, 0.38);
        border-color: rgba(94, 238, 160, 0.45);
        color: #f4f1e6;
      }
      .advisor-cand-card {
        font-weight: 600;
      }
      .advisor-cand-stats {
        font-variant-numeric: tabular-nums;
        font-size: 10.5px;
        color: #b8ceb8;
      }
      .advisor-deduction {
        margin-top: auto;
        padding-top: 5px;
        border-top: 1px solid rgba(215, 178, 92, 0.16);
        font-size: 10.5px;
        line-height: 1.3;
        color: #a9a28d;
      }
      .advisor-card-chip {
        display: inline-block;
        padding: 0 3px;
        margin: 0 1px;
        border-radius: 3px;
        background: #f6eedb;
        font-weight: 700;
        font-size: 0.94em;
        line-height: 1.2;
      }
      .advisor-card-chip.is-red {
        color: #b91c1c;
      }
      .advisor-card-chip.is-black {
        color: #17191c;
      }
      .leader-row.is-clickable {
        cursor: pointer;
        border-radius: 4px;
        padding: 2px 5px;
        transition: background 0.14s ease, border-color 0.14s ease;
      }
      .leader-row.is-clickable:hover {
        background: rgba(215, 178, 92, 0.14);
      }
      .leader-row.is-current .leader-name {
        color: #f6d375;
        font-weight: 700;
      }

      .settings-backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(5, 9, 7, 0.72);
        backdrop-filter: blur(4px);
      }

      .settings-backdrop.is-hidden {
        display: none;
      }

      .settings-modal {
        width: min(370px, 100%);
        max-height: 90vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 14px 16px;
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(20, 31, 25, 0.98) 0%, rgba(12, 18, 15, 0.99) 100%);
        border: 1px solid rgba(212, 175, 55, 0.42);
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.78);
      }

      body.mode-ega .settings-modal {
        background: #0d1017;
        border-color: #3f4b66;
      }

      .settings-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(212, 175, 55, 0.18);
      }

      .settings-modal-title {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #f4e6be;
      }

      .settings-close-btn {
        background: rgba(255, 255, 255, 0.05);
        color: #cfc6ae;
        border: 1px solid rgba(212, 175, 55, 0.25);
        border-radius: 6px;
        width: 26px;
        height: 24px;
        font: inherit;
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
      }

      .settings-close-btn:hover {
        background: rgba(212, 175, 55, 0.18);
        border-color: rgba(236, 198, 86, 0.65);
        color: #fff2c2;
      }

      .settings-section {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .settings-section-title {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #b7a982;
      }

      .settings-section .lang-segmented {
        margin-bottom: 0;
      }

      .shell-btn-wide {
        grid-column: 1 / -1;
      }

      .shell-btn-danger.is-armed {
        background: rgba(138, 30, 42, 0.85);
        border-color: rgba(252, 128, 138, 0.88);
        color: #ffe2e5;
      }

      .settings-footer {
        display: flex;
        justify-content: flex-end;
        padding-top: 6px;
        border-top: 1px solid rgba(212, 175, 55, 0.16);
      }

      .settings-done-btn {
        min-width: 96px;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-GDJwToLE.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="loading-msg">Loading EGA resources &amp; AdLib soundtrack...</div>
    </div>
  </body>
</html>
