const SUITS = ['V', 'K', 'B', 'C'];
let hands = [[], [], []], scores = [0, 0, 0], low = [0,0,0,0], high = [0,0,0,0], turn = 0, first = true, over = false;

function canPlay(c) {
  if (first) return c.s === 2 && c.r === 9;
  if (c.r === 9) return low[c.s] === 0;
  if (low[c.s] === 0) return false;
  return c.r === low[c.s] - 1 || c.r === high[c.s] + 1;
}

function newGame() {
  low = [0,0,0,0]; high = [0,0,0,0]; first = true; over = false;
  const deck = [];
  for (let s = 0; s < 4; s++) for (let r = 6; r <= 14; r++) deck.push({s, r});
  for (let i = 35; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  hands = [deck.slice(0,12), deck.slice(12,24), deck.slice(24,36)];
  hands.forEach(h => h.sort((a,b) => a.s - b.s || a.r - b.r));
  for (let p = 0; p < 3; p++) if (hands[p].some(c => c.s === 2 && c.r === 9)) turn = p;
  render();
  if (turn !== 0) setTimeout(botStep, 650);
}

function doPlay(p, c) {
  const idx = hands[p].findIndex(x => x.s === c.s && x.r === c.r);
  hands[p].splice(idx, 1);
  if (c.r === 9) { low[c.s] = 9; high[c.s] = 9; }
  else if (c.r < low[c.s]) low[c.s] = c.r;
  else high[c.s] = c.r;
  first = false;
  if (hands[p].length === 0) {
    over = true;
    document.getElementById('status-msg').textContent = (p === 0 ? 'Вы победили!' : `Победил Игрок ${p+1}!`);
    render();
    return;
  }
  turn = (turn + 1) % 3;
  render();
  if (turn !== 0) setTimeout(botStep, 650);
}

function passHuman() {
  scores[0]++;
  turn = (turn + 1) % 3;
  render();
  if (turn !== 0) setTimeout(botStep, 650);
}

function botStep() {
  if (over || turn === 0) return;
  const legal = hands[turn].filter(canPlay);
  if (legal.length === 0) {
    scores[turn]++;
    turn = (turn + 1) % 3;
    render();
    if (turn !== 0) setTimeout(botStep, 650);
    return;
  }
  // Декомпилированная эвристика Gamos (CS:606C..6DE3)
  let best = legal[0], bestW = -999;
  for (const c of legal) {
    const ownBelow = hands[turn].filter(x => x.s === c.s && x.r < c.r).length;
    const ownAbove = hands[turn].filter(x => x.s === c.s && x.r > c.r).length;
    let w = 100;
    if (c.r < 9) w += (ownBelow === 0 ? -40 : ownBelow * 25);
    else if (c.r > 9) w += (ownAbove === 0 ? -40 : ownAbove * 25);
    else w += (ownBelow + ownAbove) * 18;
    if (w > bestW) { bestW = w; best = c; }
  }
  doPlay(turn, best);
}

function render() {
  const brd = document.getElementById('board');
  brd.innerHTML = '';
  for (let s = 0; s < 4; s++) {
    const row = document.createElement('div');
    row.className = 's-row';
    for (let r = 6; r <= 14; r++) {
      const cell = document.createElement('div');
      cell.className = 'c-slot' + (r === 9 ? ' nine-col' : '');
      if (low[s] !== 0 && r >= low[s] && r <= high[s]) {
        const img = document.createElement('img');
        img.src = SPRITES[`${SUITS[s]}_${r}`];
        cell.appendChild(img);
      }
      row.appendChild(cell);
    }
    brd.appendChild(row);
  }
  const hDiv = document.getElementById('hand');
  hDiv.innerHTML = '';
  const legal = hands[0].filter(canPlay);
  for (const c of hands[0]) {
    const img = document.createElement('img');
    img.src = SPRITES[`${SUITS[c.s]}_${c.r}`];
    if (turn === 0 && !over && canPlay(c)) {
      img.className = 'playable';
      img.onclick = () => doPlay(0, c);
    }
    hDiv.appendChild(img);
  }
  document.getElementById('pass-btn').style.display = (turn === 0 && !over && legal.length === 0) ? 'inline-block' : 'none';
  document.getElementById('c-p1').textContent = hands[1].length;
  document.getElementById('c-p2').textContent = hands[2].length;
  document.getElementById('s-p1').textContent = scores[1];
  document.getElementById('s-p2').textContent = scores[2];
  document.getElementById('turn-lbl').textContent = ['Ваш ход', 'Барон (Бот 1)', 'Маэстро (Бот 2)'][turn];
}
newGame();
</script>
