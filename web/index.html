<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monte Carlo / Nine (1993)</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #08090c;
        color: #c8cdd8;
        font-family: ui-monospace, 'Cascadia Mono', 'Consolas', monospace;
        overflow: hidden;
      }

      #app {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px;
      }

      .stage-frame {
        position: relative;
        background: #000;
        border: 1px solid #262933;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.78);
        line-height: 0;
      }

      .stage-frame canvas {
        outline: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      .ega-scanlines {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0px,
          rgba(0, 0, 0, 0) 2px,
          rgba(0, 0, 0, 0.26) 2px,
          rgba(0, 0, 0, 0.26) 4px
        );
      }

      .shell-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 6px;
        max-width: 96vw;
        font-size: 11px;
      }

      .shell-btn {
        background: #141720;
        color: #d6dce8;
        border: 1px solid #303748;
        border-radius: 4px;
        padding: 4px 8px;
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }

      .shell-btn:hover {
        background: #1f2433;
        border-color: #55617d;
      }

      .shell-status {
        color: #8f98ab;
        padding: 0 4px;
        white-space: nowrap;
      }

      .loading-msg {
        color: #a6b0c4;
        font-size: 13px;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="loading-msg">Loading EGA resources &amp; AdLib soundtrack...</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
